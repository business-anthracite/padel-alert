name: "Padel Alert — Scraping France"

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          pip install -r backend/requirements_france.txt
          playwright install chromium --with-deps

      - name: Scraper TenUp et ecrire tournaments.json (v6 — par ligue FFT)
        run: python backend/scraper_france_v8.py
