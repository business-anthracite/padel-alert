name: "Padel Alert — Diagnostic ligue (one-shot)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r backend/requirements_france.txt
          playwright install chromium --with-deps

      - name: Lancer diagnostic ligue
        run: python backend/diag_ligue.py
